### Site Settings ###
title               : Varun's Portfolio
description         : >-
                      ML Engineer and R&D practitioner. Senior Consultant (AI/ML) at Qyrus.
                      Specialises in LLM agents, RAG pipelines, agentic AI, and knowledge graphs.
baseurl             : ""
repository          : varunnjbehera/portfolio


### Plugins ###
plugins:
  - jemoji


### Navbar Settings ###
nav_exclude:
  - pages/404.html
  - pages/projects.html


### Author Info ###
author:
  name              : Varun Behera
  role              : Senior Consultant (AI/ML) · Qyrus
  company           : Qyrus
  status            : open to consulting
  image             : https://github.com/varunnjbehera.png
  email             : mail@varunbehera.com
  github            : varunbeheralego
  kaggle            : varunbeheralego
  linkedin          : varunbehera
  arxiv             : https://arxiv.org/a/behera_v_1.html
  scholar           : https://scholar.google.com/citations?user=iVUAoFYAAAAJ
  goodreads         : varunbehera


### Collections ###
collections:
  projects:
    output: true
    permalink: /projects/:name


### Disqus ###
disqus: varunbehera


### Analytics ###
analytics:
  enabled: false
  google:
    tracking_id: ""


### Defaults for collections ###
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      comments: false


### Exclude from processing ###
exclude:
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - "*.log"
  - Gemfile.lock
